name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # No test touches the network: SIDOF, www.dof.gob.mx and GitHub are mocked
  # (tests/README table in README.md), so this job needs no token.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: pip install -e ".[test]"
      - name: Run tests
        run: pytest tests

  # Sphinx gate: a strict HTML build (any broken cross-reference or other
  # warning fails it) plus the documentation's worked examples run for real
  # (network included: SIDOF, www.dof.gob.mx and the notas-archivo release),
  # separate from the pytest matrix above so a SIDOF outage fails only this
  # gate. The doctest runs only here: website.yml, which publishes the pages,
  # builds HTML only and never touches those services (issue #195 of the
  # monorepo this package was extracted from, inherited with the page).
  docs:
    runs-on: ubuntu-latest
    # The release listing is one request to api.github.com, where an
    # unauthenticated runner IP gets 60 requests an hour and a busy one runs
    # out (pull request #298 of the monorepo this
    # package was extracted from). dofjson.titulos sends the token only
    # when it is set, so this is a CI convenience, not a requirement.
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache dofjson's on-disk release cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/dofjson
          # actions/cache never saves over an existing key: bump it when the
          # examples need an asset the cached release no longer matches.
          key: docs-cache-v1
      - name: Install docs and package dependencies
        run: |
          pip install -r docs/requirements.txt
          pip install -e .
      - name: Build the docs strictly
        run: python -m sphinx -n -W --keep-going -b html docs/source docs/build/html
      - name: Run the documentation's doctest examples
        run: python -m sphinx -b doctest docs/source docs/build/doctest

  # Hard gate on the single-step-ahead rule (issue #194 of the monorepo this package
  # was extracted from, inherited with the package): __version__ may not jump more than one release past
  # what is published on PyPI.
  check-package-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install checker dependencies
        run: pip install packaging
      - name: Check package versions against PyPI
        run: python scripts/check_package_versions.py
